# ==============================================================================
# Docker Compose (Live Hot-Reloading Development Override)
# ==============================================================================
# Run with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# ==============================================================================

services:
  backend:
    volumes:
      - ./backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    ports:
      - "5173:80"
